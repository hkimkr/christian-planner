<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b7cfa" />
    <meta name="application-version" content="8.1.2" />
    <meta
      name="description"
      content="컴퓨터와 휴대폰에서 동기화되는 은혜의 하루 크리스찬 플래너"
    />
    <meta property="og:title" content="은혜의 하루 · 크리스찬 플래너" />
    <meta
      property="og:description"
      content="말씀, 기도, 감사와 일정을 한곳에서 기록하고 기기 간 동기화하세요."
    />
    <meta property="og:image" content="./og.png" />
    <link rel="manifest" href="./manifest.webmanifest?v=8.1.2" />
    <link rel="icon" href="./icon.png?v=8.1.2" />
    <link rel="apple-touch-icon" href="./icon.png?v=8.1.2" />
    <link rel="stylesheet" href="./app.css?v=8.1.2" />
    <title>은혜의 하루 · 크리스찬 플래너</title>
  </head>
  <body>
    <main class="planner-shell">
      <iframe
        id="planner-frame"
        class="planner-frame"
        src="./planner.html?v=8.1.2"
        title="은혜의 하루 · 크리스찬 플래너"
        allow="clipboard-read; clipboard-write"
      ></iframe>

      <button class="cloud-sync-launcher" id="cloud-sync-launcher" type="button">
        <span class="cloud-sync-dot" id="cloud-sync-dot"></span>
        <span id="cloud-sync-label">클라우드 로그인</span>
      </button>

      <div class="cloud-auth-backdrop" id="cloud-auth-backdrop" hidden>
        <section
          class="cloud-auth-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="cloud-auth-title"
        >
          <header class="cloud-auth-head">
            <div>
              <h1 id="cloud-auth-title">클라우드 동기화</h1>
              <p>컴퓨터와 휴대폰에서 같은 계정으로 로그인하세요.</p>
            </div>
            <button class="cloud-auth-close" id="cloud-auth-close" type="button" aria-label="닫기">
              ×
            </button>
          </header>

          <div class="cloud-auth-body">
            <div id="cloud-signed-out">
              <label class="cloud-auth-label" for="cloud-email">이메일</label>
              <input
                class="cloud-auth-field"
                id="cloud-email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
              />
              <label class="cloud-auth-label" for="cloud-password">비밀번호</label>
              <input
                class="cloud-auth-field"
                id="cloud-password"
                type="password"
                autocomplete="current-password"
                minlength="6"
                placeholder="6자 이상"
              />
              <p class="cloud-auth-error" id="cloud-auth-error" role="alert"></p>
              <div class="cloud-auth-actions">
                <button class="cloud-auth-button secondary" id="cloud-signup" type="button">
                  회원가입
                </button>
                <button class="cloud-auth-button" id="cloud-signin" type="button">
                  로그인
                </button>
              </div>
            </div>

            <div id="cloud-signed-in" hidden>
              <div class="cloud-account">
                로그인 계정
                <strong id="cloud-account-email"></strong>
              </div>
              <div class="cloud-status" id="cloud-status">클라우드 확인 중…</div>
              <button class="cloud-auth-button" id="cloud-signout" type="button">로그아웃</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <noscript>이 플래너를 사용하려면 브라우저에서 JavaScript를 활성화해주세요.</noscript>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./sync-app.js?v=8.1.2"></script>
  </body>
</html>
