      function TimeBlocks({

        const blocks = (day.blocksPlan || []).map(normalizeBlock);
        const visibleBlocks = blocks;
        const dayDuration = 1440;
        const pxPerMin = PX_PER_MIN * scheduleZoom;
        const innerHeight = dayDuration * pxPerMin;

        const wrapRef = useRef(null);
        const [wrapHeight, setWrapHeight] = useState(680);
        const [editBlock, setEditBlock] = useState(null);

        const [dragInfo, setDragInfo] = useState(null);
        const [resizeInfo, setResizeInfo] = useState(null);

        const longPressTimerRef = useRef(null);
        const touchGestureRef = useRef(null);

        useEffect(() => {
          updateDayRef.current = updateDay;
        }, [updateDay]);
        useEffect(() => {
          const el = wrapRef.current;
          if (!el) return;
          const sync = () => setWrapHeight(el.clientHeight || 680);
          sync();
          const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(sync) : null;
          ro?.observe(el);
          window.addEventListener("resize", sync);
          return () => {
            ro?.disconnect();

        const wrapMin = (min) => ((min - dayStartMin) % 1440 + 1440) % 1440;

            let newEnd = clamp(newStart + duration, newStart + 5, 1440);

                              return;
                            }

                          {seg === labelSeg && (

                              <small>
                                {minToTime(block.startMin)} – {minToTime(block.endMin)}
                              </small>
                            </>
                          )}
                          {seg.isEnd && (

                              className="tb-resize"
                              onMouseDown={(e) => handleMouseDown(e, block, "resize")}
                              onTouchStart={(e) => handleTouchStart(e, block, "resize")}
                              onClick={(e) => e.stopPropagation()}
                            />
                          )}
                        </div>

      function MonthCalendarZoom({ children }) {
        const outerRef = useRef(null);
        const [userScale, setUserScale] = useState(1);
        const pinchRef = useRef(null);
        const baseFit = 0.55;
        const scale = clamp(baseFit * userScale, 0.35, 2.2);
        const onTouchStart = (e) => {
          if (e.touches.length === 2) {
            const [a, b] = e.touches;
            pinchRef.current = {
              dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
              userScale,
            };
          }
        };
        const onTouchMove = (e) => {
          const g = pinchRef.current;
          if (!g || e.touches.length !== 2) return;
          if (e.cancelable) e.preventDefault();
          const [a, b] = e.touches;
          const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
          setUserScale(clamp(g.userScale * (dist / g.dist), 0.6, 4));
        };
        const onTouchEnd = (e) => {
          if (e.touches.length < 2) pinchRef.current = null;
        };
        return (
          <div>
            <div className="month-zoom-toolbar">
              <Button className="ghost" onClick={() => setUserScale((v) => clamp(v - 0.15, 0.6, 4))}>
                −
              </Button>
              <span className="tb-zoom-value">{Math.round(scale * 100)}%</span>
              <Button className="ghost" onClick={() => setUserScale((v) => clamp(v + 0.15, 0.6, 4))}>
                +
              </Button>
              <Button className="soft" onClick={() => setUserScale(1)}>
                맞춤
              </Button>
            </div>
            <div
              ref={outerRef}
              className="month-zoom-wrap"
              onTouchStart={onTouchStart}
              onTouchMove={onTouchMove}
              onTouchEnd={onTouchEnd}
            >
              <div style={{ width: 700 * scale, height: (6 * 100 + 34) * scale }}>
                <div className="month-zoom-inner" style={{ transform: `scale(${scale})` }}>
                  {children}
                </div>
              </div>
            </div>
            <div className="tiny muted" style={{ textAlign: "center", marginTop: 6 }}>
              두 손가락으로 확대·축소할 수 있어요
            </div>
          </div>
        );
      }

            setTagValue("");
            return;
          }
          patchGroup((g) => ({ ...g, tags: [...(g.tags || []), t] }));
          setTagValue("");
          setShowTagAdd(false);
        };
        const removeTag = (t) => patchGroup((g) => ({ ...g, tags: (g.tags || []).filter((x) => x !== t) }));
        const togglePresetTag = (t) =>
          patchGroup((g) => ({
            ...g,
            tags: (g.tags || []).includes(t) ? g.tags.filter((x) => x !== t) : [...(g.tags || []), t],
          }));
        const sortedItems = [...group.items].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        return (
          <Card className={`prayer-card type-${group.type}`}>
            <div className="card-head prayer-head-row">
              <button
                type="button"
                className="prayer-drag-handle"
                draggable
                title="순서 변경"
                aria-label="순서 변경"
                onDragStart={onDragStart}
                onDragEnd={onDragEnd}
              >
                ⠿
              </button>
              <span className={`prayer-type-badge ${group.type}`}>{group.type === "person" ? "사람" : "단체"}</span>
              <input
                className="prayer-name-input"
                value={nameDraft}
                onChange={(e) => setNameDraft(e.target.value)}
                onBlur={saveName}
                onKeyDown={(e) => e.key === "Enter" && (e.preventDefault(), e.currentTarget.blur())}
                aria-label="대상 이름"
              />
              <Button
                className="danger"
                onClick={() =>
                  window.confirm(`${group.name}의 기도 제목과 기록을 모두 삭제할까요?`) &&
                  setStore((s) => ({ ...s, prayerGroups: s.prayerGroups.filter((g) => g.id !== group.id) }))
                }
              >
                삭제
              </Button>
            </div>
            <div className="prayer-tag-pad">
              <div className="prayer-tag-row">
                {PRESET_PRAYER_TAGS.map((t) => (
                  <button
                    key={t}
                    type="button"
                    className={`preset-tag-btn ${tags.includes(t) ? "on" : ""}`}
                    onClick={() => togglePresetTag(t)}
                  >
                    {t}
                  </button>
                ))}
                {customTags.map((t) => (
                  <span className="tag-chip on" key={t}>
                    #{t}
                    <button type="button" onClick={() => removeTag(t)} aria-label={`태그 ${t} 삭제`}>
                      ×
                    </button>
                  </span>
                ))}
                <button type="button" className="add-tag-mini-btn" onClick={() => setShowTagAdd((v) => !v)}>
                  +태그추가
                </button>
              </div>
              {showTagAdd && (
                <div className="tag-add-row">
                  <input
                    className="field"
                    value={tagValue}
                    onChange={(e) => setTagValue(e.target.value)}
                    onCompositionStart={() => (tagComposingRef.current = true)}
                    onCompositionEnd={() => (tagComposingRef.current = false)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" && !tagComposingRef.current) {
                        e.preventDefault();
                        addTag();
                      }
                    }}
                    placeholder="새 태그 입력 후 Enter"
                    autoFocus
                  />
                  <Button onClick={addTag}>추가</Button>
                </div>
              )}
            </div>
            {sortedItems.map((item) => (
              <div className={`prayer-item ${item.answered ? "answered" : ""}`} key={item.id}>
                <div className="row" style={{ justifyContent: "space-between" }}>
                  <div className="row" style={{ gap: 8, flex: 1, minWidth: 0 }}>
                    <input
                      type="checkbox"
                      checked={!!item.answered}
                      onChange={(e) => {
                        patchItem(item.id, {
                          answered: e.target.checked,
                          answeredAt: e.target.checked ? Date.now() : null,
                        });
                        if (e.target.checked) toast("응답된 기도로 기록했습니다");
                      }}
                    />
                    <input
                      className="prayer-title grow"
                      value={item.title}
                      onChange={(e) => patchItem(item.id, { title: e.target.value })}
                    />
                    {item.answered && <span className="answer-badge">응답</span>}
                  </div>
                  <span className="prayer-item-time">{fmtDateTime(item.createdAt)}</span>
                  <button className="btn ghost danger" onClick={() => remove(item.id)}>
                    ×
                  </button>
                </div>
                <textarea
                  className="prayer-note"
                  value={item.note || ""}
                  onChange={(e) => patchItem(item.id, { note: e.target.value })}
                  placeholder="메모"
                />
                {item.answeredAt && (
                  <div className="tiny muted">응답 기록 · {new Date(item.answeredAt).toLocaleDateString("ko-KR")}</div>
                )}
              </div>
            ))}
            <div className="card-pad prayer-add-form stack">
              <input
                className="field"
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                placeholder="기도 제목"
              />
              <textarea
                className="field"
                value={note}
                onChange={(e) => setNote(e.target.value)}
                placeholder="상황이나 구체적인 내용을 메모하세요"
              />
              <Button className="soft" onClick={add}>
                기도 제목 추가
              </Button>
            </div>
          </Card>
        );
      }
      function PrayerView({ store, setStore, toast }) {
        const [name, setName] = useState(""),
          [type, setType] = useState("person"),
          [filter, setFilter] = useState("all"),
          [viewMode, setViewMode] = useState("all"),
          [search, setSearch] = useState(""),
          [selectedTags, setSelectedTags] = useState([]),
          [dragId, setDragId] = useState(null);
        const composingRef = useRef(false);
        const lastAddRef = useRef(0);
        const add = () => {
          if (composingRef.current) return;
          const trimmed = name.trim();
          if (!trimmed) return;
          const now = Date.now();
          if (now - lastAddRef.current < 400) return;
          lastAddRef.current = now;
          setStore((s) => {
            if (s.prayerGroups.some((g) => g.name === trimmed && g.type === type)) {
              toast?.("이미 추가된 기도 대상입니다");
              return s;
            }
            return {
              ...s,
              prayerGroups: [
                ...s.prayerGroups,
                { id: uid(), name: trimmed, type, items: [], tags: [], order: s.prayerGroups.length },
              ],
            };
          });
          setName("");
        };
        const answered = store.prayerGroups.reduce((a, g) => a + g.items.filter((i) => i.answered).length, 0),
          active = store.prayerGroups.reduce((a, g) => a + g.items.filter((i) => !i.answered).length, 0);
        const allPrayerTags = Array.from(new Set(store.prayerGroups.flatMap((g) => g.tags || []))).sort();
        const ordered = sortByOrder(store.prayerGroups);
        const q = search.trim().toLowerCase();
        const visible = ordered.filter((g) => {
          if (viewMode === "person" && g.type !== "person") return false;
          if (viewMode === "group" && g.type !== "group") return false;
          if (viewMode === "tag" && selectedTags.length > 0 && !selectedTags.some((t) => (g.tags || []).includes(t)))
            return false;
          if (q) {
            const hay = `${g.name} ${(g.tags || []).join(" ")} ${g.items
              .map((i) => `${i.title} ${i.note || ""}`)
              .join(" ")}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
        const groups = visible.map((g) => ({
          ...g,
          items: g.items.filter((i) => filter === "all" || (filter === "active" ? !i.answered : i.answered)),
        }));
        const toggleTag = (t) =>
          setSelectedTags((cur) => (cur.includes(t) ? cur.filter((x) => x !== t) : [...cur, t]));
        const reorder = (targetGroupId) => {
          if (!dragId || dragId === targetGroupId) return;
          setStore((s) => {
            const list = sortByOrder(s.prayerGroups);
            const from = list.findIndex((g) => g.id === dragId);
            const to = list.findIndex((g) => g.id === targetGroupId);
            if (from < 0 || to < 0) return s;
            const moved = [...list];
            const [item] = moved.splice(from, 1);
            moved.splice(to, 0, item);
            return { ...s, prayerGroups: moved.map((g, i) => ({ ...g, order: i })) };
          });
          setDragId(null);
        };
        return (
          <div className="stack">
            <div className="hero">
              <div>
                <div className="eyebrow">PRAYER JOURNAL</div>
                <h1 className="page-title">중보기도 노트</h1>
                <div className="page-sub">사람과 공동체를 품고, 응답의 흔적을 오래 기억하세요.</div>
              </div>
              <div className="row">
                <div className="metric">
                  <strong>{active}</strong>
                  <span>기도 중</span>
                </div>
                <div className="metric">
                  <strong>{answered}</strong>
                  <span>응답됨</span>
                </div>
              </div>
            </div>
            <Card
              title="기도 대상 추가"
              action={
                <div className="segmented">
                  {[
                    ["all", "전체"],
                    ["active", "기도 중"],
                    ["answered", "응답"],
                  ].map(([v, l]) => (
                    <button key={v} className={filter === v ? "active" : ""} onClick={() => setFilter(v)}>
                      {l}
                    </button>
                  ))}
                </div>
              }
            >
              <div className="card-pad row wrap">
                <select className="field" style={{ width: 120 }} value={type} onChange={(e) => setType(e.target.value)}>
                  <option value="person">사람</option>
                  <option value="group">단체</option>
                </select>
                <input
                  className="field grow"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  onCompositionStart={() => (composingRef.current = true)}
                  onCompositionEnd={() => (composingRef.current = false)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter" && !composingRef.current) {
                      e.preventDefault();
                      add();
                    }
                  }}
                  placeholder="이름 또는 단체명"
                />
                <Button className="primary" onClick={add}>
                  추가
                </Button>
              </div>
            </Card>
            <Card title="보기 옵션">
              <div className="card-pad stack">
                <div className="segmented">
                  {[
                    ["all", "모두"],
                    ["person", "사람"],
                    ["group", "단체"],
                    ["tag", "태그"],
                  ].map(([v, l]) => (
                    <button key={v} className={viewMode === v ? "active" : ""} onClick={() => setViewMode(v)}>
                      {l}
                    </button>
                  ))}
                </div>
                {viewMode === "tag" && (
                  <div className="prayer-view-filter">
                    {allPrayerTags.length === 0 ? (
                      <span className="tiny muted">아직 추가된 태그가 없습니다. 대상에 태그를 추가해보세요.</span>
                    ) : (
                      allPrayerTags.map((t) => (
                        <button
                          key={t}
                          type="button"
                          className={`tag-chip ${selectedTags.includes(t) ? "on" : ""}`}
                          onClick={() => toggleTag(t)}
                        >
                          #{t}
                        </button>
                      ))
                    )}
                  </div>
                )}
                <input
                  className="field"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="이름, 태그, 기도 내용으로 검색"
                />
              </div>
            </Card>
            <div className="prayer-grid">
              {groups.map((g) => (
                <div
                  key={g.id}
                  className={`prayer-drag-item ${dragId === g.id ? "dragging" : ""}`}
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={() => reorder(g.id)}
                >
                  <PrayerGroup
                    group={g}
                    setStore={setStore}
                    toast={toast}
                    onDragStart={() => setDragId(g.id)}
                    onDragEnd={() => setDragId(null)}
                  />
                </div>
              ))}
            </div>
            {groups.length === 0 && <div className="empty">기도할 사람이나 단체를 먼저 추가해보세요.</div>}
          </div>
        );
      }
      function App() {
        const [store, setStore] = useState(loadStore),
          [view, setView] = useState("day"),
          [date, setDate] = useState(() => {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            return d;
          }),
          [saveState, setSaveState] = useState("저장됨"),
          [message, setMessage] = useState("");
        const toast = (text) => {
          setMessage(text);
          window.clearTimeout(toast.t);
          toast.t = window.setTimeout(() => setMessage(""), 2800);
        };
        useEffect(() => {
          setSaveState("저장 중");
          const id = setTimeout(() => {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
              setSaveState("저장됨");
            } catch (e) {
              setSaveState("저장 실패");
              toast("저장 공간을 확인해주세요");
            }
          }, 250);
          return () => clearTimeout(id);
        }, [store]);
        const updateDay = (fn, target = date) =>
          setStore((s) => {
            const key = dayId(target),
              current = normalizeDay(s.days[key]);
            return { ...s, days: { ...s.days, [key]: fn(current) } };
          });
        const move = (amount) => {
          if (view === "week") setDate(addDays(date, amount * 7));
          else if (view === "month") setDate(new Date(date.getFullYear(), date.getMonth() + amount, 1));
          else setDate(addDays(date, amount));
        };
        const navLabel =
          view === "week"
            ? `${fmtDate(startMonday(date))} 주간`
            : view === "month"
            ? `${date.getFullYear()}년 ${date.getMonth() + 1}월`
            : dateLabel(date);
        return (
          <div className="app">
            <header className="header">
              <div className="header-inner">
                <div className="brand">
                  <span className="brand-mark brand-mark-image">
                    <img src="./icon.png?v=7-4" alt="" aria-hidden="true" />
                  </span>
                  <span>
                    <strong>은혜의 하루</strong>
                    <small>Christian Planner</small>
                  </span>
                </div>
                <nav className="nav" aria-label="주요 보기">
                  {[
                    ["day", "오늘"],
                    ["week", "주간 모아보기"],
                    ["month", "월간"],
                    ["memo", "메모"],
                    ["prayer", "기도 노트"],
                  ].map(([v, l]) => (
                    <button key={v} className={view === v ? "active" : ""} onClick={() => setView(v)}>
                      {l}
                    </button>
                  ))}
                </nav>
                <div className="header-actions">
                  {view !== "prayer" && view !== "memo" && (
                    <div className="date-nav">
                      <button className="icon-btn" aria-label="이전" onClick={() => move(-1)}>
                        ‹
                      </button>
                      <strong>{navLabel}</strong>
                      <Button onClick={() => setDate(new Date())}>오늘</Button>
                      <button className="icon-btn" aria-label="다음" onClick={() => move(1)}>
                        ›
                      </button>
                    </div>
                  )}
                  <span className="save-state">● {saveState}</span>
                </div>
              </div>
            </header>
            <div className="shell">
              <Sidebar store={store} setStore={setStore} date={date} setDate={setDate} setView={setView} toast={toast} />
              <main className="main">
                {view === "day" && (
                  <DayView date={date} store={store} updateDay={updateDay} setStore={setStore} toast={toast} />
                )}{" "}
                {view === "week" && (
                  <WeekView date={date} store={store} setStore={setStore} setDate={setDate} setView={setView} toast={toast} />
                )}{" "}
                {view === "month" && <MonthView date={date} store={store} setDate={setDate} setView={setView} />}{" "}
                {view === "memo" && <MemoView store={store} setStore={setStore} toast={toast} />}{" "}
                {view === "prayer" && <PrayerView store={store} setStore={setStore} toast={toast} />}
              </main>
            </div>
            <footer className="footer">
              모든 기록은 이 브라우저에 자동 저장됩니다. 정기적으로 백업 파일을 내려받아 보관해주세요.
            </footer>
            {message && (
              <div className="toast" role="status">
                {message}
              </div>
            )}
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("app")).render(<App />);
    </script>
  </body>
</html>
